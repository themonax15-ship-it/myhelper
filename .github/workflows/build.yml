name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unzip sources
        run: |
          unzip -o MyHelper-src.zip
          # если внутри папка MyHelper — работаем из неё
          if [ -d MyHelper ]; then
            echo "PROJECT_DIR=MyHelper" >> $GITHUB_ENV
          else
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew || true

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew build --stacktrace
          else
            gradle wrapper --gradle-version 7.4.2
            ./gradlew build --stacktrace
          fi

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: myhelper-jar
          path: |
            MyHelper/build/libs/*.jar
            build/libs/*.jar
