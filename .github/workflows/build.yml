name: Build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.4.2

      - name: Locate project (unzip if uploaded as archive)
        run: |
          if [ ! -f build.gradle ]; then
            unzip -q -o ./*.zip
          fi
          DIR=$(dirname "$(find . -name build.gradle -not -path './.git/*' | head -1)")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Build
        run: cd "$PROJECT_DIR" && gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MyHelper-jar
          path: "**/build/libs/*.jar"
          
